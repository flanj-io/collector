apiVersion: v2
name: flanj-collector
description: >-
  The Flanj Collector in its tiered shape — N stateless front collectors
  forwarding to one store pod that owns the window and serves the local UI.
type: application

# Chart version. Bump on every chart change (SemVer).
version: 0.1.0

# The collector image tag this chart is written against; `image.tag` defaults to
# it, so this is the tag a plain `helm install` pulls. It MUST name a tag that
# exists in the registry — chart-release.yml refuses to publish otherwise,
# because a chart that installs and then ImagePullBackOffs is worse than no
# chart. Keep it equal to the published Docker Hub tag: the chart renders
# configs whose keys are frozen in contracts/CONTRACTS.md §8, so a chart ahead
# of the image can also render a config the image refuses to load.
appVersion: "v0.1.0"

home: https://github.com/flanj-io/collector
sources:
  - https://github.com/flanj-io/collector
keywords:
  - opentelemetry
  - api
  - contract-drift
  - observability
annotations:
  # ELv2, like the collector itself.
  licenses: Elastic-2.0
