# Flanj Collector — default values.
#
# This chart installs the TIERED shape only (docs/DEPLOYMENT.md "Tiered: N
# fronts -> 1 store pod"): N stateless front collectors and ONE store pod, the
# same image in two roles. The single-pod and shared-postgres shapes stay in
# DEPLOYMENT.md as raw objects — they are one Deployment each and do not need a
# chart.
#
# Three supported tiers, all of them this same topology:
#
#   eval        store.persistence.enabled=false          (sqlite on an emptyDir — data dies with the pod)
#   small prod  store.persistence.enabled=true           (sqlite on a PVC — the default)
#   scale       store.backend=postgres                   (no PVC; store.replicas may exceed 1)
#
# REQUIRED on every tier: specToken. The store pod refuses to start without it
# and a front without it reads no contracts (see "specToken" below). The values
# schema refuses an install that omits it rather than shipping a pod that exits.

# -- Image -------------------------------------------------------------------
image:
  repository: flanj/collector
  # Defaults to .Chart.AppVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent
  # Names of image-pull Secrets, e.g. [{name: regcred}].
  pullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # Used when create=false, or to name the created account.
  name: ""
  annotations: {}

# -- The shared contract token (FLANJ_SPEC_TOKEN) ----------------------------
# The store pod serves the contracts uploaded in its UI to the fronts over an
# intra-cluster port; this token is the only thing guarding it. It MUST be the
# same value on both roles, which is what the chart does for you — but it has
# to exist:
#
#   * the store pod REFUSES TO START without it (it will not bind a
#     cluster-reachable port unauthenticated), and
#   * a front with a wrong or empty one starts fine, gets 401 on every contract
#     read, and silently detects no REST drift at all.
#
# So this chart will not render without one. Supply either `value` (the chart
# creates the Secret) or `existingSecret` (you created it).
specToken:
  value: ""
  existingSecret: ""
  key: spec-token

# -- Identity ----------------------------------------------------------------
integration:
  # id: DEPRECATED and IGNORED (CONTRACTS §8, 2026-09-14) — the deployment's
  # identity is its collector NAME, given in the Connect panel. Accepted so an
  # existing values file still installs; nothing is rendered from it.
  id: ""
  # consumerDisplayName: DEPRECATED and IGNORED (2026-09-19) — the collector no
  # longer names its organization. A workspace has one display name, chosen by
  # its contact on the control plane's confirmation page after Connect.
  # Accepted so an existing values file still installs; nothing is rendered
  # from it.
  consumerDisplayName: ""
  # providerDisplayName: DEPRECATED and IGNORED for the flag (2026-09-19) — the
  # control plane now names the provider side of every thread itself (verified
  # domain ownership, else a verified directory name, else the domain).
  # Accepted so an existing values file still installs; nothing is sent from
  # it. Never named an edge either.
  providerDisplayName: ""

# -- Control plane (store pod only; the fronts never talk off-cluster) -------
controlPlane:
  # Where THIS COLLECTOR's requests go. The default is the hosted control
  # plane; point it at an in-cluster address to reach a control plane through
  # your own network. Knowing the address sends nothing: every outbound path
  # is gated on the collector key that only Connect (Settings, in the UI)
  # mints, so an installed-but-unconnected deployment makes no outbound
  # request at all. Set it to "" to run fully local — the collector captures
  # normally, it just cannot create thread links.
  baseUrl: https://app.flanj.io
  # The control-plane origin YOUR BROWSER can open, for the Connected pill's
  # dashboard link. For the hosted control plane it is the same as baseUrl.
  # Change it together with baseUrl whenever baseUrl becomes an address a
  # laptop cannot resolve — which includes every in-cluster Service name.
  publicUrl: https://app.flanj.io
  deployToken:
    value: ""
    existingSecret: ""
    key: cp-deploy-token
  # Periodic shape-only findings sync (never the observed values).
  findingSync: true
  # Periodic display-name refresh (sends nothing about your edges).
  directorySync: true
  # Periodic edge registration: the registrable DOMAIN of each external edge,
  # its direction and first/last seen — never calls, bodies or payloads, and
  # never an internal edge. Requires Connect.
  edgeSync: true

# -- Front collectors (stateless; this is the tier you scale) ----------------
collector:
  # Ignored when autoscaling.enabled.
  replicas: 2

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    # Set either or both; 0 disables that metric.
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 0
    behavior: {}

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  # Extra env vars (list of core/v1 EnvVar).
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

  # The contract YOU publish as a provider, validating your own inbound
  # responses (flanjdrift.self_spec_path). Mount it yourself via extraVolumes /
  # extraVolumeMounts and name the path here; empty disables self validation.
  selfSpecPath: ""
  # selfIntegrationId: DEPRECATED and IGNORED (2026-09-14, with integration_id):
  # the collector derives every key itself. Accepted so an existing
  # values file still installs; nothing is rendered from it.
  selfIntegrationId: ""

  # Escape hatch: a complete front config that REPLACES everything the chart
  # renders. You then own every key, including store_pod_endpoint and
  # store_pod_token — the chart still injects FLANJ_SPEC_TOKEN into the pod, so
  # `${env:FLANJ_SPEC_TOKEN}` keeps working.
  config: ""

# -- The store pod (one, unless backend=postgres) ----------------------------
store:
  # sqlite  -> StatefulSet, replicas fixed at 1, one db file
  # postgres -> Deployment, replicas may exceed 1, no PVC
  backend: sqlite

  # Only ever >1 with backend=postgres. With sqlite exactly one pod may own the
  # db file, so the schema refuses anything else.
  replicas: 1

  persistence:
    # sqlite only. false = emptyDir: the eval tier, and the window dies with
    # the pod. Must be false with backend=postgres (there is nothing to persist
    # locally, and a PVC there is a durability claim the deployment does not
    # make).
    enabled: true
    size: 10Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    # Use a PVC you already created instead of the volumeClaimTemplate.
    existingClaim: ""

  # Rolling-window caps (flanjstore.window_max_rows / window_max_bytes).
  window:
    maxRows: 10000
    maxBytes: 268435456 # 256 MiB

  # backend=postgres: the DSN. Supply `value`, or `existingSecret` + `key`, or
  # enable the bundled evaluation postgres below.
  dsn:
    value: ""
    existingSecret: ""
    key: dsn

  # backend=postgres only: path to a legacy sqlite file to import ONCE at start
  # (flanjstore.db_path). Mount it yourself; empty means no import.
  sqliteImportPath: ""

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

  # Escape hatch — a complete store config replacing everything the chart
  # renders. You own spec_endpoint and spec_token then; the pod still gets
  # FLANJ_SPEC_TOKEN, CP_DEPLOY_TOKEN and FLANJ_PG_DSN in its environment.
  config: ""

# -- Bundled postgres (EVALUATION ONLY) --------------------------------------
# One replica, one PVC, no backups, no HA, no tuning. It exists so the postgres
# tier can be tried in one command. For anything real, point store.dsn at a
# database you operate.
postgres:
  enabled: false
  image: postgres:16-alpine
  imagePullPolicy: IfNotPresent
  database: flanj
  username: flanj
  # Required when enabled. Deliberately NOT generated: a password regenerated
  # on the next `helm upgrade` locks the store out of its own database, and the
  # failure reads as a database outage.
  password: ""
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

# -- Services ----------------------------------------------------------------
service:
  # The SDK's target. ClusterIP by design — the collector is outbound-only and
  # nothing here should be exposed to the internet.
  front:
    type: ClusterIP
    port: 4318
    annotations: {}
    # An ADDITIONAL Service for the same front pods, at a name that does not
    # move with the release name — so there is ONE address that is right for
    # everyone who ran the documented install, and documentation can print it
    # literally instead of guessing what you called the release:
    #
    #   http://flanj-collector.<release namespace>:4318/v1/logs
    #
    # The release-scoped Service (`<release>-flanj-collector-front`) stays and
    # keeps working; this is a second name for the same pods, so an existing
    # deployment upgrades with nothing to change.
    #
    # TWO RELEASES IN ONE NAMESPACE COLLIDE ON IT. That is deliberate: Helm
    # refuses the second install outright, because the object belongs to the
    # first release — a clean refusal before anything is created, rather than
    # one release quietly taking over an address the other's applications are
    # already using. Set this to "" on the second release (its applications then
    # use the release-scoped name) or install it in its own namespace.
    fixedName: flanj-collector
  # Intra-cluster only: :4318 front->store ingest, :5337 the contract read.
  store:
    annotations: {}

# -- ConfigMap/flanj-endpoint ------------------------------------------------
# One key, FLANJ_OTLP_ENDPOINT, holding the same address the fixed Service
# serves — for teams who would rather write
#
#   envFrom:
#     - configMapRef: { name: flanj-endpoint }
#
# on their workload than the literal string. A POD CAN ONLY REFERENCE A
# CONFIGMAP IN ITS OWN NAMESPACE, and this chart installs into the collector's,
# so list every application namespace that wants one. They must already exist
# (`--create-namespace` creates the release's and nothing else) and the
# installing credential must be allowed to write there.
#
# The release namespace is always included. The value follows
# service.front.fixedName, falling back to the release-scoped front Service when
# that is empty. Two releases in one namespace collide on this name too — set
# enabled: false on the second.
endpointConfigMap:
  enabled: true
  namespaces: []

# -- NetworkPolicy (optional) ------------------------------------------------
# Restricts the store pod's two cluster ports to the front pods of this
# release. Leave it off unless your cluster runs a policy controller.
networkPolicy:
  enabled: false
  # Extra ingress peers allowed to reach the store's ports, e.g. another
  # namespace's fronts. List of networking.k8s.io/v1 NetworkPolicyPeer.
  extraStorePeers: []

# -- Security contexts -------------------------------------------------------
# The image runs as nonroot (uid 65532) on distroless/static. fsGroup is what
# makes a freshly provisioned PVC writable without a pre-chown.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Common labels/annotations added to every rendered object.
commonLabels: {}
commonAnnotations: {}
