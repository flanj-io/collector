{{- include "flanj-collector.validate" . -}}
{{- if include "flanj-collector.ownSecretNeeded" . }}
{{/*
The credentials supplied as values. Anything given as an `existingSecret` is
referenced where it is and never copied in here.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flanj-collector.secretName" . }}
  labels:
    {{- include "flanj-collector.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- if and .Values.specToken.value (not .Values.specToken.existingSecret) }}
  {{ .Values.specToken.key }}: {{ .Values.specToken.value | quote }}
  {{- end }}
  {{- if and .Values.controlPlane.deployToken.value (not .Values.controlPlane.deployToken.existingSecret) }}
  {{ .Values.controlPlane.deployToken.key }}: {{ .Values.controlPlane.deployToken.value | quote }}
  {{- end }}
  {{- if and (eq .Values.store.backend "postgres") (not .Values.store.dsn.existingSecret) }}
  {{- if .Values.postgres.enabled }}
  {{ .Values.store.dsn.key }}: {{ include "flanj-collector.bundledDsn" . | quote }}
  {{- else if .Values.store.dsn.value }}
  {{ .Values.store.dsn.key }}: {{ .Values.store.dsn.value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
