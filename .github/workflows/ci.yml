name: ci

# Per-PR CI for the collector. Fixtures-only — never needs the private control-plane (flag POST is
# tested against a stub). Builds the multi-stage image, runs Go unit + contract tests (ingest
# contracts/golden-otlp-call.json -> expected Finding; redaction vs vectors), and checks the
# operator doc still matches the config surface, lints the Helm chart and smokes the tiered shape it
# installs in a kind cluster. Pings e2e on merge.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Actions-minutes budget: without this, pushing three times to a branch runs three full
# pipelines to completion — nothing supersedes anything. Cancel only on pull_request: a
# push to main is the promotion signal that dispatches the integration gate, and killing
# one mid-flight would drop that dispatch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Verify DCO sign-off on PR commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # --no-merges: a merge commit contributes no authored content — the
          # commits it brings in carry their own sign-offs — and nothing that
          # creates one signs it: not GitHub's "Update branch" button, not the
          # `git merge origin/main` this workspace prescribes for resolving a
          # conflict. Without this, syncing a PR with main reds its own DCO
          # check, and the only way out is force-pushing an amended merge onto
          # a shared branch. The upstream DCO app skips merges for the same
          # reason. Residual, stated so it is not a surprise: an "evil merge"
          # carrying content present in NEITHER parent now skips the check —
          # narrow, and visible in review.
          missing=0
          for c in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            if ! git log -1 --format=%B "$c" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::commit $c is missing a Signed-off-by trailer (use git commit -s)"
              missing=1
            fi
          done
          exit $missing

  docs:
    # The operator doc is the only reference README.md links to, and it is not
    # covered by any other job. PR #19 changed the config surface without
    # touching it, leaving DEPLOYMENT.md describing a store pod that refuses to
    # boot (a REQUIRED FLANJ_SPEC_TOKEN was missing from its env table). This
    # asserts that every FLANJ_* variable the shipped example configs — and the
    # Helm chart's rendered role configs, which are a second way in — reference
    # is documented there, so the next config change cannot strand it silently.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Operator env contract — config/*.example.yaml vs DEPLOYMENT.md
        run: bash scripts/check-env-documented.sh

  fmt:
    # Formatting went unchecked from day one and ten files had drifted off
    # gofmt by 2026-09-09. That is not a cosmetic problem: any PR that runs
    # `gofmt -w` over a package it is editing sweeps up the unrelated
    # reformatting of every neighbouring file, and the author then has to pick
    # their own change back out by hand before committing (issue #55, same
    # day). One check at the gate keeps the tree at a fixed point so a
    # `gofmt -w` is always a no-op on files nobody touched.
    #
    # `gofmt` is filesystem-based, not module-aware, so ONE run at the repo
    # root covers all six modules — root plus the five components that
    # builder-config.yaml binds by path (extension/flanjui, extension/flanjstore,
    # exporter/flanjstore, processor/flanjdrift, processor/flanjredaction).
    # There is no vendor or testdata tree to exclude. `go vet` is the opposite:
    # it IS module-aware and sees only the module it runs in, so it needs the
    # same per-module loop go-test uses.
    #
    # go-version is pinned to the same '1.26' as go-test on purpose: gofmt's
    # output is a function of its toolchain, so an unpinned runner could start
    # demanding a reformat that no contributor's local gofmt produces.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.26' }
      - name: gofmt — the whole tree, every module
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean; run 'gofmt -w .' at the repo root"
            echo "$unformatted" | while read -r f; do echo "::error file=$f::not gofmt-clean"; done
            echo "--- diff ---"
            gofmt -d .
            exit 1
          fi
          echo "gofmt clean"
      - name: go vet — the root module and each component module
        # Same module list as go-test's suite loop. Kept as a loop rather than
        # a workspace so a new module cannot be silently skipped: adding one
        # means editing this list, in the same place as the test list.
        run: |
          fail=0
          for m in . extension/flanjui extension/flanjstore processor/flanjdrift processor/flanjredaction exporter/flanjstore; do
            echo "::group::go vet $m"
            ( cd "$m" && go vet ./... ) || fail=1
            echo "::endgroup::"
          done
          exit $fail

  go-test:
    runs-on: ubuntu-latest
    services:
      # Scratch database for the postgres store backend: the internal/store
      # suite runs against BOTH backends when FLANJ_TEST_PG_DSN is set, plus
      # the multi-pod concurrency tests (several store handles on one database).
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flanj_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FLANJ_TEST_PG_DSN: postgres://postgres:postgres@localhost:5432/flanj_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.26' }
      - name: Unit + contract tests (custom components)
        run: go test ./... -count=1
      - name: Store suite with the race detector (both backends + multi-pod concurrency)
        run: go test ./internal/store/... -count=1 -race
      - name: Unit + contract tests (the component modules — each its own Go module)
        # `go test ./...` above walks the ROOT module only. Every custom component
        # is a separate Go module (builder-config.yaml binds them by path), so
        # none of their suites ran here — including extension/flanjui's 2k-line
        # relay walk and the agent MCP surface beside it. A test that never runs
        # in CI is a green check that means nothing.
        run: |
          for m in extension/flanjui extension/flanjstore processor/flanjdrift processor/flanjredaction exporter/flanjstore; do
            echo "::group::$m"
            ( cd "$m" && go test ./... -count=1 )
            echo "::endgroup::"
          done
      - name: Net audit — the redaction floor must never link network-capable packages
        # internal/redact runs on every captured body and must be pure: no HTTP, no
        # subprocesses, no TLS dialing anywhere in its dependency graph. phonenumbers
        # has no net at all; govalidator links bare `net` for its DNS helpers (the
        # functions we call are pure — netban_test.go bans the impure ones by name),
        # but nothing may pull in net/http, os/exec or crypto/tls.
        run: |
          if go list -deps ./internal/redact | grep -E '^(net/http|os/exec|crypto/tls)$'; then
            echo "::error::internal/redact links a banned network-capable package"
            exit 1
          fi

  docker-build:
    # The single-binary artifact is built entirely in Docker (multi-stage: node builds the Vue UI ->
    # go builds the collector embedding it). No host Go needed for the artifact.
    #
    # The UI vitest suite runs here rather than in its own job: the Dockerfile's ui stage only ever
    # runs `npm run build`, so ui/src/*.test.ts executed nowhere in CI. Hosting it in this job reuses
    # the checkout, leaves notify-e2e's `needs` untouched, and fails before the expensive image
    # build. node-version matches the Dockerfile's node:22-alpine ui stage (vite >=8 needs >=22.12).
    #
    # `npm run typecheck` (vue-tsc) rides along for the same reasons, and covers what vitest cannot:
    # vite build does not type-check, and the vitest suite only loads the .ts unit files, so a type
    # error inside a .vue <template> — a renamed field, a wrong prop, a null deref — used to ship
    # green. ui/package.json pins typescript to the 5.x line on purpose: npm's `latest` is now
    # TypeScript 7 (the native port), which no longer exports ./lib/tsc and makes vue-tsc die with
    # ERR_PACKAGE_PATH_NOT_EXPORTED. Do not widen that range without re-running the typecheck.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - name: Install UI deps
        working-directory: ./ui
        run: npm ci
      - name: UI unit tests (Vue SPA — vitest)
        working-directory: ./ui
        run: npm test
      - name: UI typecheck (vue-tsc — the only thing that reads .vue templates)
        working-directory: ./ui
        run: npm run typecheck
      - uses: docker/setup-buildx-action@v4
      - name: Build collector image
        run: docker build -t flanj-collector:ci .

  helm:
    # The chart is greenfield and the tiered shape has two failures that are
    # invisible from `kubectl get pods`: a store pod with no contract token
    # exits at startup, and a front with the wrong one runs Ready forever while
    # detecting nothing at all. `helm lint` cannot see either — it proves the
    # chart renders, not that what it renders boots. So this job lints every
    # tier's values and then INSTALLS two of them into a kind cluster and
    # asserts behaviour: the UI answers on the store pod's loopback bind, a
    # call POSTed to the front service arrives in the store's window, and no
    # front is logging a contract-refresh 401.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with: { version: v3.16.1 }
      - name: helm lint — every tier in charts/flanj-collector/ci
        run: |
          fail=0
          for f in charts/flanj-collector/ci/*-values.yaml; do
            echo "::group::$f"
            helm lint --strict charts/flanj-collector -f "$f" || fail=1
            echo "::endgroup::"
          done
          exit $fail
      - uses: docker/setup-buildx-action@v4
      - name: Build collector image
        run: docker build -t flanj-collector:helm-smoke .
      - uses: helm/kind-action@v1
        with:
          cluster_name: flanj-helm-smoke
          wait: 120s
      - name: Kind smoke — the tiered lane, sqlite and postgres
        env:
          SKIP_CLUSTER: "1" # kind-action already made the cluster
        run: |
          kind load docker-image flanj-collector:helm-smoke --name flanj-helm-smoke
          PG_IMAGE="$(helm show values charts/flanj-collector | awk '/^  image: postgres/ {print $2}')"
          docker pull "$PG_IMAGE"
          kind load docker-image "$PG_IMAGE" --name flanj-helm-smoke
          bash scripts/helm-smoke.sh flanj-collector:helm-smoke

  notify-e2e:
    needs: [dco, docs, fmt, go-test, docker-build, helm]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # THIS REPO'S CI IS FREE — it is public. The gate this dispatch fires is not: it runs in the
      # PRIVATE e2e repo and costs ~19 minutes of its Actions budget, which measured 2026-09-12 was
      # 75% of the whole org's private spend. So the dispatch, and only the dispatch, asks whether
      # this merge could possibly change the answer. Everything above still runs on every push.
      #
      # It FAILS OPEN: a force-push, a brand-new branch or an API hiccup leaves the file list unknown
      # and dispatches anyway, because a gate that did not run is a worse outcome than one that did
      # not need to.
      - name: Dispatch integration gate
        env:
          TOKEN: ${{ secrets.E2E_DISPATCH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -z "$TOKEN" ]; then echo "E2E_DISPATCH_TOKEN not set; skipping dispatch"; exit 0; fi

          # What this push changed, or "" when that cannot be determined.
          files=""
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            files=$(gh api "repos/$REPO/compare/$BEFORE...$HEAD_SHA" --jq '.files[].filename' 2>/dev/null || true)
          fi
          # INERT paths, as an explicit short list rather than a clever pattern. Note what is NOT in
          # it: any CONTRACTS*.md. A contracts document is the wire format's source of truth in this
          # org and is vendored here from e2e, so a change to one always earns a gate run. Nor is
          # DEPLOYMENT.md, whose env table this repo's own CI enforces against the code.
          inert='^(README|CHANGELOG|CONTRIBUTING|SECURITY|CODE_OF_CONDUCT|LICENSE|NOTICE)|^docs/'
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE "$inert"; then
            echo "every changed file is inert — not spending the private e2e repo's budget on a gate run:"
            printf '%s\n' "$files" | sed 's/^/  /'
            exit 0
          fi

          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/flanj-io/e2e/dispatches \
            -d "$(jq -n --arg sha "$HEAD_SHA" '{event_type:"component-updated",client_payload:{repo:"collector",sha:$sha}}')"
