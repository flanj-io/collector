openapi: 3.0.3
info:
  title: Acme Payments API
  version: "1.0.0"
  description: >
    Mock provider spec used by Vinifera v0. The consumer's live traffic is validated against THIS
    document. The flagship drift: the live /v1/charges response returns `amount` as a string, but this
    spec declares it an integer -> a live-traffic-vs-spec type mismatch (the provider breaching its own
    published contract).
servers:
  - url: https://api.acme.test
paths:
  /v1/charges:
    post:
      operationId: createCharge
      summary: Create a charge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChargeRequest"
      responses:
        "200":
          description: Charge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Charge"
components:
  schemas:
    ChargeRequest:
      type: object
      required: [amount, currency, source]
      properties:
        amount:
          type: integer
          format: int64
          description: Amount in minor units.
        currency:
          type: string
        source:
          type: string
          description: A card token (never a raw PAN).
        idempotency_key:
          type: string
    Charge:
      type: object
      required: [id, object, amount, currency, status, created, card]
      properties:
        id:
          type: string
        object:
          type: string
          enum: [charge]
        amount:
          type: integer
          format: int64
          description: Amount in minor units. THE LIVE RESPONSE DRIFTS TO A STRING HERE.
        currency:
          type: string
        status:
          type: string
          enum: [pending, succeeded, failed]
        created:
          type: integer
          format: int64
        card:
          $ref: "#/components/schemas/Card"
    Card:
      type: object
      required: [last4, brand]
      properties:
        last4:
          type: string
        brand:
          type: string
