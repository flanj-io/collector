# Step A normalization fixture — OpenAPI side (v0.5 spec §4.A acceptance (1)).
#
# The SAME logical contract as contract-normalization-tools-list.json, expressed
# as OpenAPI: two payment-shaped operations. contract/normalize_test.go loads
# BOTH fixtures and asserts the paired Operations' description, inputSchema and
# outputSchema are deep-equal after normalization (transport identity — id,
# kind, match — differs by design).
#
# COLLECTOR-OWNED for now (like golden-otlp-server-call.json); promote to the
# canonical e2e/contracts set when another repo consumes it.
openapi: 3.0.3
info:
  title: Contract Normalization Fixture (payment-shaped)
  version: 1.0.0
paths:
  /accounts/{account_id}/balance:
    get:
      description: Get the current balance for an account.
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  amount:
                    type: integer
                  currency:
                    type: string
                    enum: [USD, EUR, GBP]
                required: [amount, currency]
  /refunds:
    post:
      description: Create a refund for a charge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                charge_id:
                  type: string
                amount:
                  type: integer
                  minimum: 1
                reason:
                  type: string
                  enum: [duplicate, fraudulent, requested_by_customer]
              required: [charge_id, amount]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  refund_id:
                    type: string
                  status:
                    type: string
                    enum: [pending, succeeded, failed]
                required: [refund_id, status]
