<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- data-theme is stamped on <html> above so the FIRST PAINT is light for
         everyone, including a dark-OS visitor: tokens.css carries a
         `prefers-color-scheme` block for surfaces whose toggle is optional, and
         its own `:root:not([data-theme="light"])` guard is the documented way to
         opt out of it. main.ts re-stamps the stored preference before mount, so
         a dark-mode user still gets dark with no flash of the wrong palette.
         The collector's theme ruling (ux-design-v2 §3) is unchanged. -->
    <title>Flanj Collector</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
