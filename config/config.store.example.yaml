# Flanj Collector — STORE role of the tiered topology (docs/STORE.md "Topologies").
#
# Exactly ONE store pod per deployment (with backend=sqlite; with backend=postgres
# the store tier may scale too). It receives the front collectors' already
# redacted + drift-detected records over OTLP/HTTP, owns the rolling window
# (finding dedup, pin-on-finding, eviction — it is the single writer), and serves
# the local UI + the flag action:
#
#   fronts -> OTLP/HTTP (:4318) -> flanjredaction -> flanjstore exporter -> store
#                                                             flanjui (127.0.0.1:5335)
#
# Invariants:
#   * The store pod NEVER runs flanjdrift — it would re-detect every forwarded
#     call and double the findings' occurrence_count. Drift runs exactly once per
#     call, on the front.
#   * Contracts are uploaded HERE (the UI lives on this pod) and read BY the
#     fronts over spec_endpoint below. That read is the only reason an upload
#     takes effect on a tiered deployment at all — and, since 2026-09-07, how
#     every front shares one MCP baseline: the tools/list snapshots the fronts
#     forward up are served back down over the same endpoint.
#   * flanjredaction stays on (idempotent, add-only, skips non-call records): the
#     floor on the last hop before persistence, even if something bypasses a front.
#   * sqlite: db_path on a PVC, one pod per file. postgres: dsn, no PVC.
#
# Baked into the image as /etc/flanj/store.yaml — select with
#   --config /etc/flanj/store.yaml
# Every key here is frozen in contracts/CONTRACTS.md §8.

extensions:
  flanjstore:
    backend: sqlite # default; may be omitted
    db_path: /data/flanj.db # required iff backend=sqlite — MUST be on a persistent volume (PVC)
    window_max_rows: 10000
    window_max_bytes: 268435456 # 256 MiB
    # The CONTRACT endpoint — how fronts read the contracts uploaded in this
    # pod's UI. Read-only and contracts-only: it serves provider contract
    # metadata and documents, nothing else. Required on a tiered deployment
    # (without it, uploads reach no front and REST drift never runs); leave it
    # unset on every other shape, where drift reads the store in-process.
    #
    # This is a ClusterIP-facing port like :4318, NOT the UI — the UI stays on
    # loopback.
    spec_endpoint: 0.0.0.0:5337
    # REQUIRED whenever spec_endpoint is set — the collector refuses to start
    # without it rather than bind this port unauthenticated. An unset env var
    # expands to the empty string, so "forgot to set it" must not silently mean
    # "no auth" on a port the whole namespace can reach.
    spec_token: ${env:FLANJ_SPEC_TOKEN} # shared with the fronts' flanjdrift.store_pod_token; never logged
    # --- postgres variant (BYO-DB; the store tier may then scale) -------------
    # backend: postgres
    # dsn: ${env:FLANJ_PG_DSN} # required iff backend=postgres; logged redacted only
    # db_path: /data/flanj.db  # OPTIONAL here: one-shot import of a legacy sqlite file

  # localhost UI + read API + POST /api/flag -> control plane (reach it via
  # `kubectl port-forward` to the store pod).
  flanjui:
    ui_endpoint: 127.0.0.1:5335 # loopback only — the collector is outbound-only
    integration_id: acme-payments
    consumer_display_name: Acme Consumer Ltd
    provider_display_name: Acme Payments # the fallback provider name sent ON A FLAG, so a thread names the provider when the UI does not.
    #                                     It does NOT name an edge: edge names come from the UI rename, the uploaded contract's title, or the
    #                                     directory (Overview → Edges → Rename). Nothing migrates into the store on boot — the config name
    #                                     tier went with spec_path/peer_host (CONTRACTS §8, 2026-08-31); this key needs no edge linkage at all.
    cp_base_url: https://cp.flanj.test
    cp_deploy_token: ${env:CP_DEPLOY_TOKEN} # used once, for Connect (register); the per-deployment collector key it returns lives in the store

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  flanjredaction: {}

exporters:
  flanjstore: {}

service:
  extensions: [flanjstore, flanjui]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [flanjredaction]
      exporters: [flanjstore]
  telemetry:
    logs:
      level: info
