# Flanj Collector — FRONT role of the tiered topology (docs/STORE.md "Topologies").
#
# N front collectors are STATELESS (no store, no UI, no PVC — scale them with
# replicas or an HPA). Each one receives the SDK's OTLP, applies the redaction
# floor and drift detection NEAR THE TRAFFIC, and forwards the resulting records
# (calls, findings, contract metadata) to the ONE store pod over OTLP/HTTP:
#
#   SDK -> OTLP/HTTP (:4318) -> flanjredaction -> flanjdrift -> otlphttp -> store pod (:4318)
#
# Invariants:
#   * A front ALWAYS runs flanjdrift, even with no spec: it stamps the canonical
#     `flanj.call.id`, which is what makes front->store retries idempotent and
#     ties each finding to its call across the hop.
#   * A front has NO flanjstore extension/exporter and NO flanjui — the store
#     pod owns the window (dedup, pinning, eviction) and serves the UI + flag.
#   * All SDK traffic enters via fronts; the store pod's :4318 is for fronts.
#
# Baked into the image as /etc/flanj/front.yaml — select with
#   --config /etc/flanj/front.yaml
# Every flanj.* key here is frozen in contracts/CONTRACTS.md §8; `otlphttp` is
# the core OpenTelemetry exporter (its keys are upstream's).

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  # The floor is always on; the only knob is `enable_ip: true` (optional, off by default).
  flanjredaction: {}

  # Drift detection runs HERE, once per call. The processor must be in the
  # pipeline even with no contracts (call-id stamping — see invariants above).
  #
  # A front owns no store, so it cannot see the contracts an operator uploaded
  # in the UI — those live on the STORE POD. `store_pod_endpoint` is how it
  # reads them: it fetches contract metadata on a one-minute ticker and
  # downloads only what changed, keeping the parsed documents in memory.
  #
  # Leave it unset and this front detects NO REST drift at all, however many
  # contracts have been uploaded. It logs that at start rather than failing —
  # a spec-less front is a legitimate configuration — but on a tiered
  # deployment it is almost always a mistake.
  flanjdrift:
    integration_id: acme-payments
    store_pod_endpoint: ${env:FLANJ_STORE_SPEC_ENDPOINT:-http://flanj-store:5337}
    store_pod_token: ${env:FLANJ_SPEC_TOKEN} # must match the store pod's flanjstore.spec_token
    # self_spec_path: /etc/flanj/self-spec.yaml
    # self_integration_id: self

exporters:
  # Forward to the store pod. Plain HTTP inside the cluster (ClusterIP service);
  # the queue + retries ride out a store-pod restart. No batching inside the
  # queue, so each received request is forwarded whole (calls stay ahead of the
  # findings they produced); the store is order-independent regardless.
  otlphttp:
    endpoint: ${env:FLANJ_STORE_ENDPOINT:-http://flanj-store:4318}
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 1000

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [flanjredaction, flanjdrift]
      exporters: [otlphttp]
  telemetry:
    logs:
      level: info
